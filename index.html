<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Videoteca Izeta</title>
<meta name="description" content="Menu de vídeos Izeta: busque e assista direto do Google Drive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #eef3f4;
    --surface: #ffffff;
    --surface-2: #e2eaec;
    --ink: #0f2130;
    --muted: #566875;
    --line: #d3dde0;
    --accent: #0b7a75;
    --accent-ink: #ffffff;
    --accent-soft: #d4ecea;
    --shade: rgba(15, 33, 48, .72);
    --shadow: 0 1px 2px rgba(15,33,48,.06), 0 8px 24px -12px rgba(15,33,48,.18);
    --display: "Sora", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b141b;
      --surface: #122029;
      --surface-2: #1a2b36;
      --ink: #e4eef1;
      --muted: #93a7b2;
      --line: #22363f;
      --accent: #3cc2b5;
      --accent-ink: #062422;
      --accent-soft: #143a38;
      --shade: rgba(3, 8, 12, .82);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b141b; --surface: #122029; --surface-2: #1a2b36; --ink: #e4eef1; --muted: #93a7b2;
    --line: #22363f; --accent: #3cc2b5; --accent-ink: #062422; --accent-soft: #143a38;
    --shade: rgba(3, 8, 12, .82);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; }

  /* ── Topo ── */
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner { display: grid; gap: 14px; padding-block: 18px 14px; }
  .brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  h1 { margin: 0; font: 700 clamp(22px, 3vw, 28px)/1.1 var(--display); letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .search { position: relative; }
  .search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 48px; padding: 0 44px 0 42px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); color: var(--ink); font: 500 16px var(--body);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search kbd {
    position: absolute; right: 12px; top: 50%; translate: 0 -50%;
    font: 600 12px var(--body); color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--bg);
  }

  .search input:not(:placeholder-shown) + kbd { display: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip small { font-variant-numeric: tabular-nums; opacity: .6; margin-left: 4px; }

  /* ── Grade ── */
  main { padding-block: 24px 56px; }
  .group + .group { margin-top: 36px; }
  .group h2 {
    margin: 0 0 14px; font: 600 13px/1 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    display: flex; align-items: center; gap: 10px;
  }
  .group h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

  .card {
    display: grid; grid-template-rows: auto 1fr; text-align: left; padding: 0; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
  .thumb .bgblur { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; filter: blur(18px) saturate(1.1); opacity: .7; }
  .thumb .img { position: relative; width: 100%; height: 100%; object-fit: cover; }
  .thumb.tall .img { object-fit: contain; }
  .thumb .fallback { position: absolute; inset: 0; display: grid; place-items: center; font: 700 28px var(--display); color: var(--muted); }
  .play {
    position: absolute; inset: 0; margin: auto; width: 52px; height: 52px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
    opacity: 0; scale: .85; transition: opacity .18s, scale .18s; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .play svg { width: 20px; height: 20px; margin-left: 3px; }
  .card:hover .play, .card:focus-visible .play { opacity: 1; scale: 1; }
  .fmt {
    position: absolute; left: 8px; bottom: 8px; font: 600 11px var(--body); letter-spacing: .04em;
    background: rgba(8, 18, 26, .72); color: #fff; padding: 2px 7px; border-radius: 5px;
  }
  .meta { padding: 12px 14px 14px; display: grid; gap: 4px; align-content: start; }
  .meta h3 { margin: 0; font: 600 15px/1.3 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .meta p { margin: 0; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }

  .empty { text-align: center; padding: 64px 16px; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font: 600 18px var(--display); margin-bottom: 6px; }

  /* ── Player ── */
  dialog.player {
    border: 0; padding: 0; background: transparent; color: var(--ink);
    width: 100%; max-width: 100%; height: 100%; max-height: 100%;
  }
  dialog.player::backdrop { background: var(--shade); backdrop-filter: blur(4px); }
  .stage {
    height: 100%; display: grid; place-items: center; padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .panel {
    background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 30px 80px -20px rgba(0,0,0,.6);
    width: min(100%, var(--pw)); display: grid;
  }
  .screen-box { background: #000; }
  .screen { position: relative; background: #000; aspect-ratio: var(--ar); width: min(100%, var(--vw)); margin-inline: auto; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #9fb3bd; font-size: 14px; }
  .info { padding: 14px 16px 16px; display: grid; gap: 12px; }
  .info-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .info h2 { margin: 0; font: 600 18px/1.25 var(--display); }
  .info .desc { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .close {
    flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); cursor: pointer; display: grid; place-items: center;
  }
  .close svg { width: 16px; height: 16px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; }
  .quality { display: flex; align-items: center; gap: 10px; }
  .quality .lbl { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer;
    font-size: 14px; font-weight: 600; display: grid; line-height: 1.15; text-align: center;
  }
  .seg button small { font-weight: 500; font-size: 11px; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button[aria-pressed="true"] small { color: inherit; opacity: .8; }
  .seg button:disabled { cursor: not-allowed; opacity: .4; }
  .ext { font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: none; }
  .ext:hover { text-decoration: underline; }
  .note { margin: 0; font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 8px 12px; }
  .note b { color: var(--ink); font-weight: 600; }

  @media (max-width: 520px) {
    .wrap { padding-inline: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .meta p { display: none; }
    .search kbd { display: none; }
    .stage { padding: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .play { transition: none; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand-row">
      <h1>Videoteca <span>Izeta</span></h1>
      <div class="count" id="count"></div>
    </div>
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nome, assunto ou categoria…" autocomplete="off" aria-label="Buscar vídeos">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria"></div>
  </div>
</header>

<main class="wrap" id="list"></main>

<dialog class="player" id="player" aria-labelledby="pTitle">
  <div class="stage" id="stage">
    <div class="panel" id="panel">
      <div class="screen-box">
        <div class="screen">
          <div class="loading">Carregando vídeo…</div>
          <iframe id="frame" title="Player de vídeo" allow="autoplay; fullscreen" allowfullscreen></iframe>
        </div>
      </div>
      <div class="info">
        <div class="info-head">
          <div>
            <h2 id="pTitle"></h2>
            <p class="desc" id="pDesc"></p>
          </div>
          <button class="close" id="close" aria-label="Fechar player">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="controls">
          <div class="quality">
            <span class="lbl">Qualidade</span>
            <div class="seg" id="seg" role="group" aria-label="Qualidade do vídeo"></div>
          </div>
          <a class="ext" id="pLink" target="_blank" rel="noopener">Abrir no Google Drive ↗</a>
        </div>
        <p class="note" id="pNote" hidden></p>
      </div>
    </div>
  </div>
</dialog>

<script src="videos.js"></script>
<script>
(() => {
  const VIDEOS = (window.VIDEOS || []).map((v, i) => ({ ...v, idx: i, key: v.versoes.alta }));
  const QUALIDADES = [
    { id: "alta",  nome: "Alta",  dica: "1080p" },
    { id: "media", nome: "Média", dica: "720p" },
    { id: "baixa", nome: "Baixa", dica: "360p" }
  ];
  const FORMATOS = {
    horizontal: { ar: "16 / 9", rotulo: "16:9" },
    vertical:   { ar: "9 / 16", rotulo: "9:16" },
    quadrado:   { ar: "4 / 5",  rotulo: "4:5" }
  };

  const $ = s => document.querySelector(s);
  const list = $("#list"), q = $("#q"), chips = $("#chips"), count = $("#count");
  const dlg = $("#player"), frame = $("#frame"), seg = $("#seg");

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };

  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const thumbUrl = v => `https://drive.google.com/thumbnail?id=${v.capa || v.versoes.alta}&sz=w640`;
  const previewUrl = id => `https://drive.google.com/file/d/${id}/preview`;
  const viewUrl = id => `https://drive.google.com/file/d/${id}/view`;

  // Destaca os termos buscados sem quebrar acentos
  function highlight(text, terms) {
    if (!terms.length) return esc(text);
    const n = norm(text);
    const marks = new Array(text.length).fill(false);
    for (const t of terms) {
      let i = n.indexOf(t);
      while (i !== -1) { for (let j = i; j < i + t.length; j++) marks[j] = true; i = n.indexOf(t, i + t.length); }
    }
    let out = "", open = false;
    for (let i = 0; i < text.length; i++) {
      if (marks[i] && !open) { out += "<mark>"; open = true; }
      if (!marks[i] && open) { out += "</mark>"; open = false; }
      out += esc(text[i]);
    }
    return out + (open ? "</mark>" : "");
  }

  // ── Filtros ──
  const categorias = [...new Set(VIDEOS.map(v => v.categoria))];
  let catAtual = "Todos";
  function renderChips() {
    const all = [["Todos", VIDEOS.length], ...categorias.map(c => [c, VIDEOS.filter(v => v.categoria === c).length])];
    chips.innerHTML = all.map(([c, n]) =>
      `<button class="chip" aria-pressed="${c === catAtual}" data-cat="${esc(c)}">${esc(c)}<small>${n}</small></button>`
    ).join("");
  }
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    catAtual = b.dataset.cat; renderChips(); render();
  });

  // ── Lista ──
  function card(v, terms) {
    const f = FORMATOS[v.formato] || FORMATOS.horizontal;
    const tall = v.formato !== "horizontal";
    const src = thumbUrl(v);
    return `
      <button class="card" data-i="${v.idx}" aria-label="Assistir: ${esc(v.titulo)}">
        <div class="thumb${tall ? " tall" : ""}">
          ${tall ? `<img class="bgblur" src="${src}" alt="" loading="lazy" aria-hidden="true">` : ""}
          <img class="img" src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer"
               onerror="this.closest('.thumb').innerHTML='<div class=fallback>▶</div>'">
          <span class="fmt">${f.rotulo}</span>
          <span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></span>
        </div>
        <div class="meta">
          <h3>${highlight(v.titulo, terms)}</h3>
          <p>${highlight(v.descricao || "", terms)}</p>
        </div>
      </button>`;
  }

  function render() {
    const terms = norm(q.value).split(/\s+/).filter(Boolean);
    const found = VIDEOS.filter(v => {
      if (catAtual !== "Todos" && v.categoria !== catAtual) return false;
      const hay = norm(`${v.titulo} ${v.descricao} ${v.categoria}`);
      return terms.every(t => hay.includes(t));
    });

    count.textContent = found.length === VIDEOS.length
      ? `${VIDEOS.length} vídeos`
      : `${found.length} de ${VIDEOS.length} vídeos`;

    if (!found.length) {
      list.innerHTML = `<div class="empty"><strong>Nenhum vídeo encontrado</strong>Tente outra palavra ou escolha “Todos” nos filtros.</div>`;
      return;
    }
    const grupos = catAtual === "Todos" ? categorias : [catAtual];
    list.innerHTML = grupos.map(c => {
      const itens = found.filter(v => v.categoria === c);
      if (!itens.length) return "";
      return `<section class="group"><h2>${esc(c)}</h2><div class="grid">${itens.map(v => card(v, terms)).join("")}</div></section>`;
    }).join("");
  }

  list.addEventListener("click", e => {
    const c = e.target.closest(".card"); if (c) abrir(VIDEOS[+c.dataset.i]);
  });
  q.addEventListener("input", render);

  // ── Player ──
  let atual = null;
  let qualidade = store.get("qualidade") || "alta";

  function tamanhoPainel(v) {
    const f = FORMATOS[v.formato] || FORMATOS.horizontal;
    const [w, h] = f.ar.split("/").map(Number);
    const panel = $("#panel");
    panel.style.setProperty("--ar", f.ar);
    // Largura máxima: o vídeo + os controles abaixo dele cabem na tela sem rolar
    const controles = window.innerWidth < 520 ? 250 : 210;
    const maxH = window.innerHeight - controles - 32;
    const byHeight = Math.max(240, maxH) * (w / h);
    const vw = Math.min(1100, Math.max(200, byHeight), window.innerWidth - 32);
    panel.style.setProperty("--vw", vw + "px");
    panel.style.setProperty("--pw", Math.max(vw, 460) + "px");
  }

  function tocar() {
    const v = atual;
    const disponivel = QUALIDADES.filter(x => v.versoes[x.id]);
    const escolhida = v.versoes[qualidade] ? qualidade : "alta";
    const id = v.versoes[escolhida];

    seg.innerHTML = QUALIDADES.map(x => {
      const tem = !!v.versoes[x.id];
      const on = tem && x.id === escolhida;
      return `<button data-q="${x.id}" aria-pressed="${on}" ${tem ? "" : "disabled"}
                title="${tem ? "Tocar em qualidade " + x.nome.toLowerCase() : "Versão " + x.nome.toLowerCase() + " ainda não cadastrada"}">
                ${x.nome}<small>${x.dica}</small></button>`;
    }).join("");

    const note = $("#pNote");
    if (disponivel.length < QUALIDADES.length) {
      note.innerHTML = `Este vídeo tem só o arquivo original. Para economizar internet, toque na <b>⚙ engrenagem</b> do player e escolha <b>Qualidade → 360p</b> ou <b>720p</b>.`;
      note.hidden = false;
    } else note.hidden = true;

    const src = previewUrl(id);
    if (frame.getAttribute("src") !== src) frame.src = src;
    $("#pLink").href = viewUrl(id);
  }

  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    qualidade = b.dataset.q; store.set("qualidade", qualidade); tocar();
  });

  function abrir(v, { push = true } = {}) {
    atual = v;
    $("#pTitle").textContent = v.titulo;
    $("#pDesc").textContent = v.descricao || "";
    tamanhoPainel(v);
    tocar();
    if (!dlg.open) dlg.showModal();
    if (push && location.hash.slice(1) !== v.key) history.pushState(null, "", "#" + v.key);
  }
  function fechar() {
    frame.removeAttribute("src");
    if (dlg.open) dlg.close();
    atual = null;
    if (location.hash) history.pushState(null, "", location.pathname + location.search);
  }

  $("#close").addEventListener("click", fechar);
  dlg.addEventListener("cancel", e => { e.preventDefault(); fechar(); });
  $("#stage").addEventListener("click", e => { if (e.target.id === "stage") fechar(); });
  window.addEventListener("resize", () => { if (atual) tamanhoPainel(atual); });

  function pelaUrl() {
    const k = location.hash.slice(1);
    const v = VIDEOS.find(x => x.key === k);
    if (v) abrir(v, { push: false });
    else if (dlg.open) { frame.removeAttribute("src"); dlg.close(); atual = null; }
  }
  window.addEventListener("popstate", pelaUrl);

  // Atalho "/" para buscar
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !dlg.open) { e.preventDefault(); q.focus(); }
  });

  renderChips();
  render();
  pelaUrl();
})();
</script>
</body>
</html>
